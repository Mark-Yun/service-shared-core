"""Custom scalar for multilingual fields (e.g., { "ko": "이름", "en": "Name" })"""
scalar JSON

"""문제 분류를 위한 토픽 모델"""
type Topic {
  """토픽 ID"""
  _id: ID!

  """다국어 토픽 이름"""
  name(language: String!): String!

  """다국어 설명 (선택)"""
  description(language: String): String

  """부모 토픽 (없으면 루트 토픽)"""
  parentTopic: Topic

  """자식 토픽 목록"""
  childTopics: [Topic]

  """토픽에 연결된 태그 목록"""
  tags: [String]

  """생성 일시 (ISO8601 문자열)"""
  createdAt: String!
}

"""토픽 관련 쿼리"""
type Query {
  """토픽 ID로 조회"""
  getTopicById(id: ID!): Topic

  """특정 부모 토픽의 하위 토픽 목록 조회"""
  getTopicsByParent(parentId: ID!): [Topic]

  """지정된 태그로 연결된 토픽 검색 (페이징 지원)"""
  getTopicsByTags(
    tags: [String!]
    limit: Int
    skip: Int
  ): [Topic]
}

"""토픽 관련 뮤테이션"""
type Mutation {
  """새 토픽 생성"""
  createTopic(
    """다국어 이름 (예: { "ko": "수학", "en": "Math" })"""
    name: JSON!

    """다국어 설명 (선택)"""
    description: JSON

    """부모 토픽 ID (루트일 경우 null)"""
    parentTopicId: ID

    """토픽 태그 목록"""
    tags: [String!]
  ): Topic

  """기존 토픽 정보 수정"""
  updateTopic(
    """수정할 토픽 ID"""
    id: ID!

    """다국어 이름"""
    name: JSON

    """다국어 설명"""
    description: JSON

    """부모 토픽 ID"""
    parentTopicId: ID

    """태그 목록"""
    tags: [String]
  ): Topic

  """토픽 삭제"""
  deleteTopic(id: ID!): Boolean
}
